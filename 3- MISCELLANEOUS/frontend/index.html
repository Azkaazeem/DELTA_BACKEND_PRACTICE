<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET & POST responses</title>
</head>
<body>
    <h2>GET Form</h2>
    <form method="get" action="register">
        <input type="text" name="email" placeholder="Enter Your email" style="display: block; margin-bottom: 15px;">
        <input type="text" name="user" placeholder="Enter Your username" style="display: block;  margin-bottom: 15px;">
        <input type="password" name="password" placeholder="Enter Your password" style="display: block;  margin-bottom: 15px;">
        <button>Submit</button>
    </form>

    <hr>

    <h2>POST Form</h2>
    <form method="post" action="http://localhost:8080/register">
        <input type="text" name="email" placeholder="Enter Your email" style="display: block; margin-bottom: 15px;">
        <input type="text" name="user" placeholder="Enter Your username" style="display: block;  margin-bottom: 15px;">
        <input type="password" name="password" placeholder="Enter Your password" style="display: block;  margin-bottom: 15px;">
        <button>Submit</button>
    </form>
    
</body>
</html>
